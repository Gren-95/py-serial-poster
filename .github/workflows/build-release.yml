name: Build and Release

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt } else { Write-Host "No requirements.txt" }

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build with PyInstaller
        shell: powershell
        run: |
          # Use the provided spec if present, otherwise build from scanner.py
          if (Test-Path scanner.spec) {
            pyinstaller --clean --noconfirm scanner.spec
          } else {
            pyinstaller --clean --noconfirm --onefile scanner.py
          }

      - name: Package output
        shell: powershell
        run: |
          $zip = "scanner-${{ github.ref_name }}.zip"
          if (Test-Path .\dist) {
            Compress-Archive -Path .\dist\* -DestinationPath $zip -Force
          } elseif (Test-Path .\build) {
            Compress-Archive -Path .\build\* -DestinationPath $zip -Force
          } else {
            Write-Host "No build output found"
            exit 1
          }

      - name: Create Release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: Automated build for ${{ github.sha }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: scanner-${{ github.ref_name }}.zip
          asset_name: scanner-${{ github.ref_name }}.zip
          asset_content_type: application/zip
